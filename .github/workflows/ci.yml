name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npx expo-doctor
      - run: npx expo config --type public >/tmp/expo-config.json
      - run: npm run typecheck

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run web:export
      - name: Verify web artifact
        run: test -f dist/index.html

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
      - run: npm install
      - run: npm audit --audit-level=high
      - name: Build and start local stack
        run: docker compose -f docker-compose.local.yml up -d --build
      - name: Wait for web
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.local.yml logs
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run web:test
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Stop local stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: relationship_ci
          POSTGRES_DB: relationship_tracker
          POSTGRES_USER: relationship
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relationship -d relationship_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Apply SQL migrations
        env:
          PGPASSWORD: relationship_ci
        run: |
          for file in server/sql/*.sql; do
            echo "Applying $file"
            psql -h localhost -U relationship -d relationship_tracker -f "$file"
          done

  local-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build local Docker stack
        run: docker compose -f docker-compose.local.yml build
      - name: Start local Docker stack
        run: docker compose -f docker-compose.local.yml up -d
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.local.yml logs
          exit 1
      - name: Run API unit tests in container
        run: docker compose -f docker-compose.local.yml exec -T api npm test
      - name: Run API integration smoke suite in container
        run: docker compose -f docker-compose.local.yml exec -T api npm run smoke
      - name: Stop local Docker stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
