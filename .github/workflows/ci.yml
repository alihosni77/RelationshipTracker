name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: relationship_ci
          POSTGRES_DB: relationship_tracker
          POSTGRES_USER: relationship
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relationship -d relationship_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL migrations
        env:
          PGPASSWORD: relationship_ci
        run: |
          psql -h localhost -U relationship -d relationship_tracker -f server/sql/001_init.sql
          psql -h localhost -U relationship -d relationship_tracker -f server/sql/002_relationship_features.sql
          psql -h localhost -U relationship -d relationship_tracker -f server/sql/003_notifications_assessments.sql
          psql -h localhost -U relationship -d relationship_tracker -f server/sql/004_spotify_oauth.sql

  local-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local Docker stack
        run: docker compose -f docker-compose.local.yml build
      - name: Start local Docker stack
        run: docker compose -f docker-compose.local.yml up -d
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.local.yml logs
          exit 1
      - name: Run API tests in container
        run: docker compose -f docker-compose.local.yml exec -T api npm test
      - name: Stop local Docker stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
