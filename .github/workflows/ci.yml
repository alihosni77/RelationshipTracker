name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: relationship_ci
          POSTGRES_DB: relationship_tracker
          POSTGRES_USER: relationship
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relationship -d relationship_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL migrations
        env:
          PGPASSWORD: relationship_ci
        run: psql -h localhost -U relationship -d relationship_tracker -f server/sql/001_init.sql && psql -h localhost -U relationship -d relationship_tracker -f server/sql/002_relationship_features.sql
