name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.x

      - name: Install dependencies
        run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Expo doctor
        run: npx expo-doctor

      - name: Validate Expo config
        run: npx expo config --type public >/tmp/expo-config.json

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Require Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for iOS EAS builds. Add it as a GitHub Actions secret."
            exit 1
          fi

      - name: Build iOS on EAS
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --wait

      - name: Submit latest iOS build to TestFlight
        run: npx eas-cli@latest submit --platform ios --profile production --latest --non-interactive --wait
